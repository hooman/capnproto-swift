name: release

# Cut a release from the current `main`: validate the version and its CHANGELOG entry,
# run the full CI gates on that exact commit, then create the tag and GitHub Release
# together with a source archive and a Sigstore build-provenance attestation for it.
# The `site` job then publishes that commit's documentation to GitHub Pages. Release tags are
# immutable (tag ruleset); a bad release is fixed forward, not retagged. Steps: RELEASING.md.
#
# Run: Actions ▸ release ▸ Run workflow ▸ version (e.g. 0.1.0), or
#   gh workflow run release.yml -f version=0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and changelog
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release from main only (got $GITHUB_REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::'$VERSION' is not semver without a leading v"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi
          grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' entry"; exit 1; }
          # capnpc-swift --version, and docs updated since the previous tag (RELEASING.md).
          ci/check-release.sh
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gates
    needs: validate
    uses: ./.github/workflows/embedded-clean.yml

  publish:
    name: Tag, release, and attest
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the tag and the release
      id-token: write       # Sigstore signing identity for the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::Empty CHANGELOG entry for $VERSION"; exit 1; }
      - name: Source archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="capnproto-swift-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: capnproto-swift-${{ inputs.version }}.tar.gz
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            "${prerelease[@]}" \
            "capnproto-swift-$VERSION.tar.gz" \
            "capnproto-swift-$VERSION.tar.gz.sha256"

  site:
    # The documentation site at https://hooman.github.io/capnproto-swift/, rebuilt from the
    # released commit: DocC behind the landing page (ci/build-site.py), plus the README's badge
    # data (ci/site-badges.py). It runs after the release exists; if it fails, rerun this job.
    name: Publish the documentation site
    needs: [validate, ci, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4.0-noble
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # the Pages deployment's identity
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - run: apt-get update && apt-get install -y capnproto libcapnp-dev python3
      - name: Build the site
        env:
          VERSION: ${{ inputs.version }}
          # The capnp versions the release's CI gates tested against (Linux apt, macOS Homebrew).
          CAPNP_LINUX: ${{ needs.ci.outputs.capnp_linux }}
          CAPNP_MACOS: ${{ needs.ci.outputs.capnp_macos }}
        run: |
          python3 ci/build-site.py --out _site --version "$VERSION"
          python3 ci/site-badges.py --out _site --capnp-version "$CAPNP_LINUX" --capnp-version "$CAPNP_MACOS"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
