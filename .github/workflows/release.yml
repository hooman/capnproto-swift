name: release

# Cut a release from the current `main`: validate the version and its CHANGELOG entry,
# run the full CI gates on that exact commit, then create the tag and GitHub Release
# together with a source archive and a Sigstore build-provenance attestation for it.
# The `site` job then publishes that commit's documentation to GitHub Pages. Release tags are
# immutable (tag ruleset); a bad release is fixed forward, not retagged. Steps: RELEASING.md.
#
# Run: Actions ▸ release ▸ Run workflow ▸ version (e.g. 0.1.0), or
#   gh workflow run release.yml -f version=0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and changelog
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release from main only (got $GITHUB_REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::'$VERSION' is not semver without a leading v"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi
          grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' entry"; exit 1; }
          # capnpc-swift --version, and docs updated since the previous tag (RELEASING.md).
          ci/check-release.sh
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gates
    needs: validate
    uses: ./.github/workflows/embedded-clean.yml

  publish:
    name: Tag, release, and attest
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the tag and the release
      id-token: write       # Sigstore signing identity for the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::Empty CHANGELOG entry for $VERSION"; exit 1; }
      - name: Source archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="capnproto-swift-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: capnproto-swift-${{ inputs.version }}.tar.gz
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            "${prerelease[@]}" \
            "capnproto-swift-$VERSION.tar.gz" \
            "capnproto-swift-$VERSION.tar.gz.sha256"

  site:
    # The documentation site, rebuilt from the released commit (site.yml: build, then deploy).
    # It runs after the release exists. If it fails, rerun it, or publish the tag by hand:
    # gh workflow run site.yml -f tag=X.Y.Z (RELEASING.md).
    name: Documentation site
    needs: [validate, ci, publish]
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # the Pages deployment's identity
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      version: ${{ inputs.version }}
      # The capnp versions the release's CI gates tested against (Linux apt, macOS Homebrew).
      capnp_versions: ${{ needs.ci.outputs.capnp_linux }} ${{ needs.ci.outputs.capnp_macos }}
